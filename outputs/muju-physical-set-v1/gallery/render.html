<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muju render stage</title>
<style>html,body{margin:0;background:#eceae6}canvas{display:block;width:var(--w,1200px);height:var(--h,800px)}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<script type="module">
// Headless render stage used by cad/render.mjs: ?scene=<name>&v=<variant>&w=&h=
import { Viewer } from './viewer.js';
import * as S from './scenes.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1200), H = +(q.get('h') || 800);
document.documentElement.style.setProperty('--w', W + 'px');
document.documentElement.style.setProperty('--h', H + 'px');
const D = await S.loadData();
const viewer = new Viewer(document.getElementById('c'), { preserve: true, still: true });
viewer.resize();
const v = q.get('v'), scene = q.get('scene');
let items = [], frame = {};
const iso = [0.85, 0.7, 1.2];
switch (scene) {
  case 'lineup': items = S.lineupItems(D, v); frame = { dir: [0.15, 0.5, 1.0], pad: 0.56 }; break;
  case 't3-exploded': items = S.pieceItems(D, v, q.get('el') || 'metal', q.get('owner') || 'ivory', 3); frame = { dir: [0.55, 0.28, 1], pad: 1.05 }; break;
  case 'state': items = S.pieceItems(D, v, q.get('el'), q.get('owner'), +q.get('tier')); frame = { dir: [0.45, 0.35, 1], pad: 1.0 }; break;
  case 'board': items = S.boardItems(D, v); frame = { dir: [0.0, 1.35, 1.0], pad: 0.62 }; break;
  case 'patch': items = S.patchItems(D, v); frame = { dir: [0.6, 0.95, 1.1], pad: 0.8 }; break;
  case 'beside': items = S.besideItems(D, v, q.get('el') || 'fire', q.get('owner') || 'ivory', +(q.get('tier') || 3), q.get('loose') || 'metal'); frame = { dir: [0.35, 1.2, 0.9], pad: 0.85 }; break;
  case 'resources': items = [0, 4, 8, 16].flatMap((n, i) => S.tileWithStacks(D, v, n / 4, (i - 1.5) * 58, 0)); frame = { dir: [0.3, 0.8, 1.2], pad: 0.8 }; break;
  case 'tiles': items = S.tileJoinItems(D, v, 8); frame = { dir: [0.3, 1.3, 0.9], pad: 0.85 }; break;
  case 'crystals': items = S.crystalStackItems(D); frame = { dir: [0.4, 0.6, 1.2], pad: 0.85 }; break;
  case 'gradient': items = S.boardGradientItems(D, v); frame = { dir: [0.0, 1.35, 1.0], pad: 0.62 }; break;
  case 'sections-gray': items = S.sectionItems(D, v, 'gray', 8); frame = { dir: [0.0, 1.35, 1.0], pad: 0.62 }; break;
  case 'sections-gradient': items = S.sectionItems(D, v, 'gradient', 8); frame = { dir: [0.0, 1.35, 1.0], pad: 0.62 }; break;
  case 'part': items = S.partItems(D, q.get('id'), q.get('color')); frame = { dir: iso, pad: 1.0 }; break;
}
const explode = scene === 't3-exploded' ? 1 : 0;
if (scene === 'part' && q.get('id').includes('glyph')) viewer.root.rotation.x = -Math.PI / 2 + 0; // flat, as printed
await viewer.add(items, { explode });
if (q.get('clip')) viewer.setClip(true, 0);
viewer.frame(frame);
viewer.renderNow();
await new Promise(r => setTimeout(r, 50));
viewer.renderNow();
window.READY = true;
</script>
</body></html>
