name: Deploy Games to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deevgames-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            muju/package-lock.json
            forge/package-lock.json
            oracle/package-lock.json
      - name: Install locked dependencies
        run: |
          for game in muju forge oracle; do
            (cd "$game" && npm ci --no-audit --no-fund)
          done
      - name: Build and verify public files
        run: bash build-all.sh
      - name: Install browser for smoke checks
        working-directory: oracle
        run: npx playwright install --with-deps chromium
      - name: Check phone and tablet gameplay
        run: |
          python3 -m http.server 8941 --bind 127.0.0.1 --directory _site > /tmp/deevgames-qa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tools/smoke-site.cjs http://127.0.0.1:8941
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name deevgames --branch "${{ github.ref_name }}"
      - name: Show deployment URL
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Games deployed to $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain manual deployment
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Build and gameplay checks passed. Automatic publishing awaits a configured Cloudflare deployment credential; use the documented local deployment command." >> "$GITHUB_STEP_SUMMARY"
